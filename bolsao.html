<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPQ — Bolsão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" />
  <style>
    :root {
      --bg: #020b16;
      --surface: #0a1628;
      --surface-2: #0f2140;
      --border: #1a3a5c;
      --text: #e6f3ff;
      --text-secondary: #7d9cbd;
      --royal: #4169E1;
      --royal-dim: rgba(65,105,225,0.25);
      --green: #34d399;
      --orange: #fbbf24;
      --red: #f87171;
      --font-body: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      --font-brand: 'Orbitron', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      --max-width: 1200px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(65,105,225,0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(65,105,225,0.10) 1px, transparent 1px);
      background-size: 44px 44px;
    }

    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(10,22,40,0.95), rgba(10,22,40,0.85));
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .brand {
      font-family: var(--font-brand);
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
    }
    .brand-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--royal);
      box-shadow: 0 0 18px var(--royal);
    }
    .brand-title { font-size: 14px; }
    .brand-sub { color: var(--text-secondary); font-size: 12px; font-weight: 500; margin-top: 6px; }

    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: color .2s, border-color .2s, background .2s;
    }
    .nav a:hover { color: var(--text); border-color: var(--border); background: rgba(255,255,255,0.04); }
    .nav a.active { color: var(--text); border-color: var(--border); background: rgba(255,255,255,0.06); }

    .content {
      padding: 28px clamp(18px, 4vw, 40px);
      max-width: 100%;
      overflow-x: hidden;
    }
    .container { max-width: var(--max-width); margin: 0 auto; }

    .section-title {
      font-family: var(--font-brand);
      font-size: 22px;
      margin: 0 0 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-title::before {
      content: '';
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--royal);
      box-shadow: 0 0 14px var(--royal);
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }

    .hero {
      border-radius: 20px;
      padding: 28px;
      background: linear-gradient(135deg, rgba(65,105,225,0.18), rgba(15,33,64,0.55));
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(800px circle at 20% 10%, rgba(65,105,225,0.25), transparent 60%);
      pointer-events: none;
    }
    .hero h1 {
      font-family: var(--font-brand);
      font-size: clamp(28px, 5vw, 44px);
      margin: 0 0 10px;
      line-height: 1.1;
      position: relative;
    }
    .hero p { color: var(--text-secondary); position: relative; max-width: 720px; }
    .hero .meta {
      margin-top: 18px;
      display: flex; gap: 10px; flex-wrap: wrap; position: relative;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .list li {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px; border-radius: 14px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.04);
    }
    .list li .dot { margin-top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--royal); flex-shrink: 0; }

    .callout {
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(65,105,225,0.12);
    }
    .callout.emphasis {
      background: rgba(65,105,225,0.22);
    }

    .lema {
      font-family: var(--font-brand);
      font-size: clamp(20px, 3.2vw, 30px);
      text-align: center;
      padding: 22px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(15,33,64,0.55), rgba(10,22,40,0.85));
      color: var(--text);
    }

    .footer {
      margin-top: 30px;
      color: var(--text-secondary);
      font-size: 12px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    .mobile-toggle {
      display: none;
      position: fixed;
      right: 14px;
      top: 14px;
      z-index: 20;
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(10,22,40,0.9);
      color: var(--text);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      align-items: center; justify-content: center;
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        inset: auto 0 0 0;
        top: auto;
        height: auto;
        max-height: 0;
        padding: 0 18px;
        border-right: none;
        border-top: 1px solid var(--border);
        transition: max-height .25s ease, padding .25s ease;
        z-index: 19;
        background: rgba(10,22,40,0.96);
      }
      .sidebar.open { max-height: 70vh; padding: 18px; }
      .mobile-toggle { display: inline-flex; }
      .grid-2 { grid-template-columns: 1fr; }
      .content { padding-top: 72px; }
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <button class="mobile-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div>
        <div class="brand">
          <div class="brand-mark">
            <span class="brand-dot"></span>
            <span class="brand-title">EPQ</span>
          </div>
        </div>
        <div class="brand-sub">Campanha Oficial</div>
      </div>

      <nav class="nav" aria-label="Navegação da campanha">
        <a href="#capa" class="active">Capa</a>
        <a href="#objetivo">Objetivo</a>
        <a href="#experiencia">Experiência</a>
        <a href="#comunicacao">Comunicação</a>
        <a href="#inscricao">Inscrição</a>
        <a href="#dia-evento">Dia do evento</a>
        <a href="#pos-evento">Pós-evento</a>
        <a href="#objetivo-final">Objetivo final</a>
        <a href="#lemas">Lemas</a>
      </nav>
    </aside>

    <main class="content">
      <div class="container">
        <section id="capa" class="hero">
          <h1>BOLSÃO EPQ</h1>
          <p>Apresentação oficial da campanha para atrair, apresentar e converter novos alunos por meio de uma experiência prática de preparação.</p>
          <div class="meta">
            <span class="chip">21 dias de divulgação</span>
            <span class="chip">Público: concursos</span>
            <span class="chip">Áreas: policial e militar</span>
          </div>
        </section>

        <section id="objetivo" style="margin-top: 24px;">
          <h2 class="section-title">Objetivo da campanha</h2>
          <div class="card">
            <p style="margin: 0; color: var(--text-secondary);">
              Gerar inscrições para o Bolsão EPQ e levar os participantes até a unidade, criando uma experiência que mostre, na prática, a preparação, a estrutura e a metodologia da escola.
            </p>
          </div>
        </section>

        <section id="experiencia" style="margin-top: 24px;">
          <h2 class="section-title">O que o participante vive no evento</h2>
          <div class="grid-2">
            <div class="card">
              <ul class="list">
                <li><span class="dot"></span>Fazer uma prova</li>
                <li><span class="dot"></span>Descobrir seu nível atual</li>
                <li><span class="dot"></span>Participar de um ranking</li>
                <li><span class="dot"></span>Concorrer a bolsas</li>
              </ul>
            </div>
            <div class="card">
              <ul class="list">
                <li><span class="dot"></span>Conhecer os professores</li>
                <li><span class="dot"></span>Conhecer a estrutura</li>
                <li><span class="dot"></span>Entender a metodologia</li>
                <li><span class="dot"></span>Ver preparação física e simulados</li>
              </ul>
            </div>
          </div>
        </section>

        <section id="comunicacao" style="margin-top: 24px;">
          <h2 class="section-title">A grande ideia da campanha</h2>
          <div class="callout emphasis">
            <p style="margin: 0; font-size: 20px; font-weight: 700; font-family: var(--font-brand);">
              Você não precisa esperar o edital para começar.
            </p>
            <p style="margin: 10px 0 0; color: var(--text-secondary);">
              A comunicação deve mostrar que o aluno pode começar agora, descobrir onde precisa evoluir e se preparar com antecedência — criando confiança e antecipação antes mesmo do edital sair.
            </p>
          </div>
        </section>

        <section id="inscricao" style="margin-top: 24px;">
          <h2 class="section-title">Pós-inscrição: antecipando compromisso</h2>
          <div class="card">
            <p style="margin: 0; color: var(--text-secondary);">
              Após a inscrição, o fluxo mantém contato com os participantes para aumentar o compromisso com o evento e reduzir faltas. A ideia é transformar interesse em presença confirmada.
            </p>
          </div>
        </section>

        <section id="dia-evento" style="margin-top: 24px;">
          <h2 class="section-title">No dia do Bolsão</h2>
          <div class="callout">
            <p style="margin: 0; font-weight: 700;">
              A experiência deve fazer o candidato pensar: “É aqui que eu quero me preparar.”
            </p>
            <p style="margin: 10px 0 0; color: var(--text-secondary);">
              Depois da prova, os participantes recebem bolsas de acordo com o desempenho. Mesmo quem não conquistar uma das principais bolsas recebe uma nova oportunidade para continuar na EPQ.
            </p>
          </div>
        </section>

        <section id="pos-evento" style="margin-top: 24px;">
          <h2 class="section-title">Pós-evento: apresentação e matrícula</h2>
          <div class="card">
            <p style="margin: 0 0 10px; color: var(--text-secondary);">
              Após o evento, haverá uma sequência de contato durante alguns dias para apresentar melhor o que a EPQ oferece:
            </p>
            <ul class="list">
              <li><span class="dot"></span>Os professores</li>
              <li><span class="dot"></span>A estrutura</li>
              <li><span class="dot"></span>Os aprovados</li>
              <li><span class="dot"></span>A metodologia</li>
              <li><span class="dot"></span>A preparação física</li>
              <li><span class="dot"></span>A oportunidade de matrícula</li>
            </ul>
          </div>
        </section>

        <section id="objetivo-final" style="margin-top: 24px;">
          <h2 class="section-title">Objetivo final</h2>
          <div class="card">
            <p style="margin: 0; color: var(--text-secondary);">
              O Bolsão não será apenas uma ação para gerar movimento. A estratégia é usar o evento para transformar interesse em matrícula por meio de confiança, experiência e oportunidade.
            </p>
          </div>
        </section>

        <section id="lemas" style="margin-top: 24px;">
          <h2 class="section-title">Resumo em lemas</h2>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <div class="lema">O Bolsão atrai.</div>
            <div class="lema">A experiência convence.</div>
            <div class="lema">A bolsa gera urgência.</div>
            <div class="lema">O acompanhamento ajuda a gerar a matrícula.</div>
          </div>
        </section>

        <footer class="footer">
          EPQ — Apresentação oficial da campanha Bolsão.
        </footer>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const menuToggle = document.getElementById('menuToggle');
      const sidebar = document.getElementById('sidebar');
      const navLinks = sidebar.querySelectorAll('.nav a');
      const sections = [...navLinks].map(a => document.querySelector(a.getAttribute('href')));

      menuToggle.addEventListener('click', () => {
        const open = sidebar.classList.toggle('open');
        menuToggle.textContent = open ? '✕' : '☰';
      });

      const closeMenu = () => {
        sidebar.classList.remove('open');
        menuToggle.textContent = '☰';
      };

      navLinks.forEach(link => {
        link.addEventListener('click', () => closeMenu());
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const id = entry.target.getAttribute('id');
          navLinks.forEach(link => {
            link.classList.toggle('active', link.getAttribute('href') === '#' + id);
          });
        });
      }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });

      sections.forEach(section => section && observer.observe(section));

      if (typeof gsap === 'function') {
        const targets = document.querySelectorAll('.card, .hero, .lema, .callout');
        gsap.fromTo(targets, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, stagger: 0.1, ease: 'power2.out', clearProps: 'transform' });
      }
    })();
  </script>
</body>
</html>
