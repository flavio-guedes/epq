<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPQ · Painel de Criativos</title>
<style>
  :root{
    --bg-0:#0B0F19;
    --bg-1:#111827;
    --bg-2:#1A2438;
    --bg-3:#233050;
    --line:rgba(255,255,255,0.10);
    --line-strong:rgba(255,255,255,0.18);
    --ink:#F6F9FF;
    --ink-dim:#A8B6CF;
    --ink-faint:#6B7A94;
    --amber:#F5B041;
    --amber-dim:rgba(245,176,65,0.14);
    --blue:#4D9CF6;
    --blue-dim:rgba(77,156,246,0.14);
    --green:#3CC68A;
    --green-dim:rgba(60,198,138,0.14);
    --red:#F26B6B;
    --red-dim:rgba(242,107,107,0.14);
    --grey:#8A99B4;
    --radius:14px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg-0);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Semi Condensed','Inter',sans-serif;
    font-weight:700;letter-spacing:0.01em;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:6px;}

  .shell{display:flex;min-height:100vh;}

  .sidebar{
    width:260px;flex-shrink:0;background:var(--bg-1);
    border-right:1px solid var(--line);
    padding:22px 16px;position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;gap:18px;
  }
  .brand{padding:0 6px;}
  .brand .mark{
    font-family:'Barlow Semi Condensed';font-weight:800;
    font-size:22px;letter-spacing:0.02em;
  }
  .brand .mark span{color:var(--amber);}
  .brand .sub{color:var(--ink-faint);font-size:12px;margin-top:3px;}
  .sidebar-title{
    color:var(--ink-faint);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.08em;padding:0 6px;
  }
  nav{display:flex;flex-direction:column;gap:4px;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-radius:var(--radius-sm);color:var(--ink-dim);
    cursor:pointer;font-size:14px;border-left:3px solid transparent;
    transition:all .15s ease;
  }
  .navitem:hover{color:var(--ink);background:var(--bg-2);}
  .navitem.active{color:var(--ink);background:var(--bg-2);border-left:3px solid var(--amber);}
  .navitem .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex-shrink:0;}
  .navitem.active .dot{background:var(--amber);}
  .sidebar-foot{
    color:var(--ink-faint);font-size:11.5px;padding:0 6px;
    border-top:1px solid var(--line);padding-top:14px;line-height:1.5;
  }

  main{flex:1;min-width:0;padding:24px 28px 60px;max-width:1240px;}

  .pagehead{margin-bottom:22px;}
  .pagehead h1{font-size:26px;}
  .pagehead p{color:var(--ink-dim);margin-top:6px;font-size:14px;max-width:760px;}

  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;
  }
  .search{
    background:var(--bg-2);border:1px solid var(--line-strong);color:var(--ink);
    padding:11px 14px;border-radius:var(--radius-sm);font-size:14px;
    flex:1 1 260px;min-width:0;outline:none;
  }
  .search::placeholder{color:var(--ink-faint);}
  .select{
    background:var(--bg-2);border:1px solid var(--line-strong);color:var(--ink);
    padding:11px 12px;border-radius:var(--radius-sm);font-size:14px;
    min-width:200px;outline:none;
  }
  .count-pill{
    color:var(--ink-faint);font-size:12px;padding:8px 10px;
    background:var(--bg-2);border:1px solid var(--line);border-radius:999px;
  }

  .grid{display:grid;grid-template-columns:repeat(1,1fr);gap:14px;}
  @media(min-width:980px){ .grid{grid-template-columns:repeat(2,1fr);} }

  .card{
    background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:12px;
    transition:border-color .15s ease;
  }
  .card:hover{border-color:var(--line-strong);}

  .card-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .card-title{font-size:17px;font-weight:700;}
  .badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
    border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;
    letter-spacing:.02em;
  }
  .b-pmerj{background:rgba(77,156,246,0.18);color:#7BB9FF;border:1px solid rgba(77,156,246,0.28);}
  .b-basica{background:rgba(60,198,138,0.14);color:#6AE6AD;border:1px solid rgba(60,198,138,0.24);}
  .b-gcm{background:rgba(245,176,65,0.14);color:#FFD07A;border:1px solid rgba(245,176,65,0.24);}
  .b-militar{background:rgba(242,107,107,0.14);color:#FF9E9E;border:1px solid rgba(242,107,107,0.24);}
  .b-aquecimento{background:rgba(138,153,180,0.12);color:#C5D0E1;border:1px solid rgba(138,153,180,0.22);}
  .b-remarketing{background:rgba(255,255,255,0.06);color:#DDE6F3;border:1px solid rgba(255,255,255,0.12);}

  .section-label{
    font-size:11px;font-weight:700;color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.08em;
  }

  .meta{display:flex;flex-direction:column;gap:10px);}
  .meta{display:flex;flex-direction:column;gap:10px;}

  .row{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:start;}
  .row .k{
    color:var(--ink-faint);font-weight:700;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.06em;padding-top:1px;
  }
  .row .v{color:var(--ink);font-size:13.5px;line-height:1.55;}
  .row .v.highlight{color:#FFD07A;font-weight:600;}

  .copy-block{
    background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px;color:var(--ink);font-size:13.5px;line-height:1.6;
  }

  .cta-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(245,176,65,0.10),rgba(245,176,65,0.04));
    border:1px solid rgba(245,176,65,0.28);border-radius:var(--radius-sm);
    padding:12px 14px;
  }
  .cta-label{font-size:11.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;}
  .cta-value{color:var(--ink);font-weight:700;font-size:14px;}

  .meta-footer{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    color:var(--ink-faint);font-size:12px;
  }

  @media(max-width:900px){
    .shell{flex-direction:column;}
    .sidebar{position:static;width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line);padding:14px 14px;gap:12px;}
    main{padding:18px 16px 50px;max-width:100%;}
    .row{grid-template-columns:1fr;gap:4px;}
    .row .k{padding-top:0;}
    .card{padding:14px;}
  }
</style>

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function render(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const f = document.getElementById('filterSegment').value;
  const navActive = document.querySelector('.navitem.active');
  const navFilter = navActive ? navActive.dataset.filter : 'all';
  const useFilter = f !== 'all' ? f : navFilter;

  const filtered = creatives.filter(c=>{
    const matchesSearch = !q ||
      c.title.toLowerCase().includes(q) ||
      c.copy.toLowerCase().includes(q) ||
      c.headline.toLowerCase().includes(q) ||
      c.subheadline.toLowerCase().includes(q) ||
      c.cta.toLowerCase().includes(q);
    const matchesFilter = useFilter === 'all' || c.segment === useFilter;
    return matchesSearch && matchesFilter;
  });

  document.getElementById('countPill').textContent = filtered.length + ' de ' + creatives.length + ' criativos';

  document.getElementById('grid').innerHTML = filtered.map(c=>`
    <div class="card" data-segment="${esc(c.segment)}">
      <div class="card-header">
        <div class="card-title">${esc(c.title)}</div>
        <span class="badge ${esc(c.badge)}">${esc(c.badgeLabel)}</span>
      </div>

      <div class="meta">
        <div class="row"><div class="k">Headline</div><div class="v highlight">${esc(c.headline)}</div></div>
        <div class="row"><div class="k">Sub-headline</div><div class="v">${esc(c.subheadline)}</div></div>
        ${c.artBody ? `<div class="row"><div class="k">Texto da arte</div><div class="v">${esc(c.artBody)}</div></div>` : ''}
        <div class="row"><div class="k">Hierarquia</div><div class="v">${esc(c.artHierarchy)}</div></div>
      </div>

      <div>
        <div class="section-label" style="margin-bottom:8px;">Legenda</div>
        <div class="copy-block">${esc(c.caption)}</div>
      </div>

      <div class="cta-row">
        <div>
          <div class="cta-label">CTA</div>
          <div class="cta-value">${esc(c.cta)}</div>
        </div>
        <div style="text-align:right;">
          <div class="cta-label">Formato</div>
          <div class="cta-value" style="font-weight:600;">${esc(c.formatos)}</div>
        </div>
      </div>

      <div class="meta-footer">
        <div>Destino: <b style="color:var(--ink-dim);font-weight:600;">${esc(c.destino)}</b></div>
        <div>Sem valores no anúncio</div>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('#nav .navitem').forEach(item=>{
  item.addEventListener('click', ()=>{
    document.querySelectorAll('#nav .navitem').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('filterSegment').value = 'all';
    render();
  });
});

['searchInput','filterSegment'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

render();
