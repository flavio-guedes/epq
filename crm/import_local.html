<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EPQ · Importar CRM Local</title>
<style>
  :root{--bg:#05080f;--panel:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.12);--text:#e6f3ff;--mute:#7d9cbd;--accent:#22d3ee}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);background:linear-gradient(180deg,#05080f,#0b1428);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  h1{font-size:18px;margin-bottom:6px}
  .sub{color:var(--mute);font-size:13px;margin-bottom:14px}
  .form{display:grid;gap:10px}
  label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em}
  input[type="file"]{padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.06);color:var(--text);font-size:13px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .btn{border:1px solid rgba(255,255,255,0.18);color:#e6f3ff;background:rgba(255,255,255,0.08);padding:10px 12px;border-radius:12px;font-size:13px;cursor:pointer}
  .btn.primary{background:rgba(34,211,238,0.18);border-color:rgba(34,211,238,0.45);color:#cffafe}
  .hint{font-size:12px;color:#f87171;min-height:16px;margin-top:6px}
  .ok{font-size:12px;color:#34d399;margin-top:6px}
  a{color:#7dd3fc;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>Importar leads para o CRM</h1>
  <div class="sub">Carregue um JSON de leads para usar offline no CRM.</div>
  <div class="form">
    <label>Arquivo JSON</label>
    <input id="file" type="file" accept="application/json" />
    <div class="actions">
      <button class="btn primary" id="importar">Importar</button>
      <a class="btn" href="crm_seed.json" download>Baixar seed</a>
      <a class="btn" href="../crm/CRM.html">Abrir CRM</a>
    </div>
    <div id="hint" class="hint"></div>
    <div id="ok" class="ok"></div>
  </div>
</div>
<script>
  const KEY = 'epq_crm_leads_v2';
  document.getElementById('importar').addEventListener('click', async ()=>{
    const hint = document.getElementById('hint');
    const ok = document.getElementById('ok');
    hint.textContent = ''; ok.textContent = '';
    const file = document.getElementById('file').files[0];
    if (!file){ hint.textContent = 'Selecione um arquivo JSON.'; return; }
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const arr = Array.isArray(data) ? data : (data.leads || data.registros || []);
      if (!arr.length){ hint.textContent = 'JSON não contém leads.'; return; }
      const normalized = arr.map((item, idx)=>{
        const lead = {
          id: item.id || item.uuid || String(Date.now()).slice(-6) + String(idx),
          name: item.nome || item.name || 'Lead ' + (idx + 1),
          phone: item.telefone || item.phone || '',
          email: item.email || '',
          whatsapp: item.whatsapp || item.telefone || item.phone || '',
          course: item.produto || item.course || item.curso || '',
          source: item.origem || item.source || '',
          createdAt: (item.created_at || item.createdAt || '').slice(0,10) || new Date().toISOString().slice(0,10),
          lastContact: (item.updated_at || item.updatedAt || item.ultima_interacao || '').slice(0,10) || new Date().toISOString().slice(0,10),
          nextFollowUp: (item.proximo_followup || item.nextFollowUp || '').slice(0,10) || new Date().toISOString().slice(0,10),
          nextTime: item.nextTime || '09:00',
          nextType: item.proximo_tipo || item.nextType || 'WhatsApp',
          nextNote: item.proximo_nota || item.nextNote || 'Importado via importador local.',
          temperature: item.temperatura || item.temperature || 'Morno',
          stage: item.etapa || item.stage || 'Novo',
          status: item.status || 'ativo',
          ownerId: item.responsavel_id || item.ownerId || 'local',
          ownerName: item.responsavel_id || item.ownerName || 'local',
          history: Array.isArray(item.history) ? item.history : [{ id: String(Date.now()) + '_h1', date: new Date().toISOString().slice(0,10), type: 'Importação', note: 'Importado via importador local.' }],
        };
        return lead;
      });
      localStorage.setItem(KEY, JSON.stringify(normalized));
      ok.textContent = 'Importado ' + normalized.length + ' leads. Abrindo CRM...';
      setTimeout(()=>{ window.location.href = 'CRM.html'; }, 800);
    } catch (err) {
      hint.textContent = 'Falha ao importar: ' + (err.message || err);
    }
  });
</script>
</body>
</html>
